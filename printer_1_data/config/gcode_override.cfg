#### DISPLAY REMAINING TIME INSTEAD OF TIME ELAPSED ON LCD ####
[display_template _printing_time]
text:
    {% set ptime = printer["gcode_macro M73"].r %}
    { "%02d:%02d" % (ptime // 60, ptime % 60) }

[gcode_macro M73]
rename_existing: M73.1
variable_p: 0.0
variable_r: 0.0

gcode:
    # Use a default 0 if _P is omitted.
    {% set P = params.P|default(0)|int %}
    # Use a default 0 if _R is omitted.
    {% set R = params.R|default(0)|int %}

    M73.1 P{P}
    SET_GCODE_VARIABLE MACRO=M73 VARIABLE=p VALUE={P}
    SET_GCODE_VARIABLE MACRO=M73 VARIABLE=r VALUE={R}
###############################################################

[gcode_macro TURN_OFF_HEATERS]
rename_existing: TURN_OFF_HEATERS_BASE
gcode:
  UPDATE_DELAYED_GCODE ID=_NOZZLE_COOLDOWN_FAN DURATION=0
  TURN_OFF_HEATERS_BASE
  {% if printer.extruder.temperature|float > 50.0 %}
    M106 S255
    UPDATE_DELAYED_GCODE ID=_NOZZLE_COOLDOWN_FAN DURATION=1
  {% endif %}

[delayed_gcode _NOZZLE_COOLDOWN_FAN]
gcode:
  {% set nozzle_target = printer.extruder.target|float %}
  {% set bed_target = printer.heater_bed.target|float %}
  {% set nozzle_temp = printer.extruder.temperature|float %}

  {% if nozzle_target > 0.0 or bed_target > 0.0 %}
    M106 S0
  {% elif nozzle_temp <= 50.0 %}
    M106 S0
  {% else %}
    M106 S255
    UPDATE_DELAYED_GCODE ID=_NOZZLE_COOLDOWN_FAN DURATION=5
  {% endif %}

[gcode_macro SDCARD_RESET_FILE]
rename_existing: SDCARD_RESET_FILE_BASE
gcode:
  SDCARD_RESET_FILE_BASE
  SET_GCODE_VARIABLE MACRO=_LCD_STATE VARIABLE=stopped_latch VALUE=0
  SET_GCODE_VARIABLE MACRO=_LCD_STATE VARIABLE=completed_latch VALUE=0
  SET_GCODE_VARIABLE MACRO=_LCD_STATE VARIABLE=busy VALUE=0
  SET_GCODE_VARIABLE MACRO=_LCD_STATE VARIABLE=suppress_printing VALUE=0
  UPDATE_DELAYED_GCODE ID=_LCD_STATUS_TICK DURATION=0.1

[gcode_macro G28]
rename_existing: G0028
gcode:
  _LCD_BUSY CODE=1
  SET_DISPLAY_TEXT MSG="Homing..."
  G0028 {rawparams}
  _LCD_IDLE
  UPDATE_DELAYED_GCODE ID=_LCD_STATUS_TICK DURATION=0.1

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: SCREWS_TILT_CALC_ORIG
gcode:
  _LCD_BUSY CODE=2
  SET_DISPLAY_TEXT MSG="Tramming..."
  SCREWS_TILT_CALC_ORIG {rawparams}
  _LCD_IDLE
  UPDATE_DELAYED_GCODE ID=_LCD_STATUS_TICK DURATION=0.1
