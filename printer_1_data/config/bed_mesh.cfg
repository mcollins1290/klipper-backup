[bed_mesh]
#If stepper_x [position_max] and/or stepper_y [position_max] change then mesh_min and mesh_max in bed_mesh.cfg will need to be recalculated.
#https://www.th3dstudio.com/klipper-abl-mesh-safe-homing-calculator/?srsltid=AfmBOorimPQRo4V_6BsYfkFQRwvip-eZ7aVUQeECqGSJstkV1Ict5J-d
speed: 120
horizontal_move_z: 3

# These are probe positions (not nozzle); keeping your X but
# pulling Y slightly off the very front edge
mesh_min: 63.4, 10
mesh_max: 285, 210

# Higher resolution grid
probe_count: 7, 7

# Interpolate more points between probed ones
mesh_pps: 2, 2

algorithm: bicubic
bicubic_tension: 0.2

# Mesh fade: either keep it active for a while or disable fading
fade_start: 0.0
fade_end: 0.0                  # or set fade_end: 0 to disable fade
