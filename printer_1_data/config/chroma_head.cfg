[mcu cp_Head]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FF6F063146503005351043-if00
restart_method: command


[temperature_sensor cp_Head_temp]
sensor_type: temperature_mcu
sensor_mcu: cp_Head
min_temp: 0
max_temp: 60

[servo cp1]

pin: cp_Head:PA4
initial_angle: 0
maximum_servo_angle: 180
minimum_pulse_width:0.0008
maximum_pulse_width:0.00220


[gcode_macro FILAMENT_CUT]
gcode:
    G4 P400
    SET_SERVO SERVO=cp1 ANGLE=178
    G4 P1600
    SET_SERVO SERVO=cp1 ANGLE=2
    G4 P600



[extruder]
max_extrude_only_distance: 300.0
max_extrude_cross_section:10
full_steps_per_rotation: 200
step_pin: cp_Head:PA9
dir_pin: !cp_Head:PA8
enable_pin: !cp_Head:PA10
#stepx
microsteps: 16
### Co-Print default ###
#rotation_distance:  4.55287810496
########################
# 100mm --- 1/20/25
rotation_distance:   4.462
########################
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: cp_Head:PA2
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: cp_Head:PA1
control: pid
pid_Kp: 15.365
pid_Ki: 0.692
pid_Kd: 85.271
min_temp: 0
max_temp: 270
min_extrude_temp: 170
# Pressure Advance Smooth Time should not change and so can live here.
pressure_advance_smooth_time: 0.040

[verify_heater extruder]
heating_gain: 2
check_gain_time:35
hysteresis: 10
max_error: 9999999999

# BEGIN: ChromaHead Inductive Probe
#[probe]
#pin: cp_Head:PA3
#x_offset: 33
#y_offset: -1.5
#speed: 5
#lift_speed: 10
#samples: 1
#samples_result: average
#sample_retract_dist: 2.0
#samples_tolerance: 0.01
#samples_tolerance_retries: 10
# END: ChromaHead Inductive Probe

#  BEGIN: CR-Touch
[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 64.5
y_offset: -7.5
probe_with_touch_mode: true
stow_on_each_sample: false
#  https://gist.github.com/joshschools/b642dd4355cf38edbb5310b1f385e37c
pin_move_time: 0.5
pin_up_touch_mode_reports_triggered: false
speed: 10
lift_speed: 20
samples: 3
sample_retract_dist: 2
samples_tolerance: 0.01
samples_tolerance_retries: 3
samples_result: average
# END: CR-Touch

[heater_fan extruder]
heater: extruder
pin: cp_Head:PA0
heater_temp: 50.0

[fan]
pin: cp_Head:PC9
