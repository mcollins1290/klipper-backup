[gcode_macro SCUT_SAVE_CONFIG]
gcode:
  SAVE_CONFIG

[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle on brush
gcode:
    {% set x_brush = -13.40 %}           # X position near the brush (adjust to your setup)
    {% set y_start = -8.9 %}             # Starting Y position
    {% set y_end = 25 %}                 # Ending Y position
    {% set z_brush = 8 %}                # Z height to press against the brush (adjust for light contact)
    {% set passes = 5 %}                 # Number of back-and-forth passes
    {% set hotend_temperature  = 190 %}  # Set your melting temperature for plastic on nozzle

    M117 Clean Nozzle...
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28         ;home axes before travel moves
    {% endif %}    
    M104 S{ hotend_temperature }   ; Heat up nozzle
    G91                            ; Relative positioning
    G1 Z12 F600                    ; Raise Z a bit before move (prevent dragging)
    G90                            ; Absolute positioning
    G1 X{x_brush} Y{y_start} F6000 ; Move to brush start
    G1 Z{z_brush} F600             ; Lower to brushing height

    {% for i in range(passes) %}
        G1 Y{y_end} F5000          ; Forward stroke
        G1 Y{y_start} F5000        ; Backward stroke
    {% endfor %}

    G1 Z10 F600                     ; Raise nozzle after cleaning
    M117 Cleaning done!