[gcode_macro SCUT_SAVE_CONFIG]
gcode:
  SAVE_CONFIG

[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    
    {% set out = [] %}

    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    
    {action_respond_info(out|join("\n"))}

[gcode_macro _LCD_STATE]
variable_busy: 0
variable_stopped_latch: 0
variable_completed_latch: 0
gcode:

[gcode_macro _LCD_BUSY]
gcode:
  SET_GCODE_VARIABLE MACRO=_LCD_STATE VARIABLE=busy VALUE=1

[gcode_macro _LCD_IDLE]
gcode:
  SET_GCODE_VARIABLE MACRO=_LCD_STATE VARIABLE=busy VALUE=0

# --- Periodic LCD status updater ---
[delayed_gcode _LCD_STATUS_TICK]
initial_duration: 1.0
gcode:
  {% set ps = printer.print_stats %}
  {% set paused = printer.pause_resume.is_paused %}
  {% set homed = printer.toolhead.homed_axes|string %}
  {% set all_homed = ('x' in homed and 'y' in homed and 'z' in homed) %}

  {% set e = printer.extruder %}
  {% set b = printer.heater_bed %}

  {% set heating_nozzle = (e.target|float > 0.0) and (e.temperature|float + 1.0 < e.target|float) %}
  {% set heating_bed    = (b.target|float > 0.0) and (b.temperature|float + 1.0 < b.target|float) %}

  {% set busy = printer["gcode_macro _LCD_STATE"].busy|int %}
  {% set stopped_latch = printer["gcode_macro _LCD_STATE"].stopped_latch|int %}
  {% set completed_latch = printer["gcode_macro _LCD_STATE"].completed_latch|int %}

  {% set msg = "" %}

  # 1) stopped latch (cancel/error) has top priority
  {% if stopped_latch %}
    {% set msg = "Print stopped" %}

  # 2) completed latch (only when not actively printing/paused)
  {% elif completed_latch and ps.state|string not in ["printing", "paused"] %}
    {% set msg = "Print Completed" %}

  # 3) printing states
  {% elif ps.state|string == "printing" %}
    {% if paused %}
      {% set msg = "Print paused" %}
    {% else %}
      {% set cur = ps.info.current_layer|default(0)|int %}
      {% set tot = ps.info.total_layer|default(0)|int %}
      {% if cur > 0 and tot > 0 %}
        {% set msg = "Layer %d of %d" % (cur, tot) %}      
      {% endif %}
    {% endif %}

  # 4) heating (only when not printing)
  {% elif heating_nozzle or heating_bed %}
    {% if heating_nozzle and heating_bed %}
      {% set msg = "Heat Noz. & Bed" %}
    {% elif heating_nozzle %}
      {% set msg = "Heating Noz." %}
    {% else %}
      {% set msg = "Heating Bed" %}
    {% endif %}

  # 5) fallback busy state (for any marked operation)
  {% elif busy %}
    {% set msg = "Busy" %}

  # 6) ready vs standby based on homed axes
  {% else %}
    {% if all_homed %}
      {% set msg = "Ready" %}
    {% else %}
      {% set msg = "Standby" %}
    {% endif %}
  {% endif %}

  SET_DISPLAY_TEXT MSG="{msg}"
  UPDATE_DELAYED_GCODE ID=_LCD_STATUS_TICK DURATION=0.5