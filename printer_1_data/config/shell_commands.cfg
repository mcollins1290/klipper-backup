[gcode_shell_command restart_chromascreen]
command: /home/cp/restart_ChromaScreen.sh
timeout: 30.
verbose: False
[gcode_macro RESTART_CHROMASCREEN]
gcode:
    RUN_SHELL_COMMAND CMD=restart_chromascreen

[gcode_shell_command backup_config]
command: /home/cp/backup_config_github.sh
timeout: 30.
verbose: True
[gcode_macro BACKUP_CONFIG]
gcode:
    RUN_SHELL_COMMAND CMD=backup_config

[gcode_shell_command REBASE_KLIPPER_UPSTREAM]
command: /home/cp/scripts/rebase_klipper_upstream.sh
timeout: 600
verbose: True
[gcode_macro REBASE_KLIPPER_UPSTREAM]
description: Rebase Klipper master onto upstream and force-push to fork (only if upstream moved)
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    {action_respond_info("Refusing: printer is printing/paused.")}
  {% else %}
    {action_respond_info("Running rebase check… watch console for DONE line. Logs: ~/klipper_rebase_logs")}
    RUN_SHELL_COMMAND CMD=REBASE_KLIPPER_UPSTREAM
  {% endif %}
