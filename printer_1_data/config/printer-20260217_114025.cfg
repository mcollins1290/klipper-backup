[include mainsail.cfg]
[include chroma_head.cfg]
[include driver.cfg]
[include bed_mesh.cfg]
[include cp_macro.cfg]
[include neopixel_leds.cfg]
[include shell_commands.cfg]
[include gcode_override.cfg]
[include custom_macro.cfg]
[include ecm.cfg]
######## OPTIONAL HARDWARE ########
#[include input_shaper.cfg]
###################################

[delayed_gcode preheat_pla]
initial_duration: 3
gcode:
  {% set preheat_pla = true %}

  {% if preheat_pla|lower == 'true' %}
    {action_respond_info("Preheat PLA is ENABLED")}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=60
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=205
  {% else %}
    {action_respond_info("Preheat PLA is DISABLED")}
  {% endif %}

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_35FFD80530554D3117810343-if00
restart_method: command

[temperature_sensor BTT_SKR_Mini_E3v2]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 60

[safe_z_home]
home_xy_position: 81.6, 101.1
speed: 60 
z_hop: 10
z_hop_speed: 5

#ARC Support: disabled for the time being to see if that addresses periodic timer too close errors.
#[gcode_arcs]
#resolution: 1.0

[stepper_x]
#If stepper_x [position_max] and/or stepper_y [position_max] change then mesh_min and mesh_max in bed_mesh.cfg will need to be recalculated.
#https://www.th3dstudio.com/klipper-abl-mesh-safe-homing-calculator/?srsltid=AfmBOorimPQRo4V_6BsYfkFQRwvip-eZ7aVUQeECqGSJstkV1Ict5J-d
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: -27
position_min: -27
position_max: 290
homing_speed: 60

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
#If stepper_x [position_max] and/or stepper_y [position_max] change then mesh_min and mesh_max in bed_mesh.cfg will need to be recalculated.
#https://www.th3dstudio.com/klipper-abl-mesh-safe-homing-calculator/?srsltid=AfmBOorimPQRo4V_6BsYfkFQRwvip-eZ7aVUQeECqGSJstkV1Ict5J-d
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -9
position_min: -9
position_max: 215
homing_speed: 60

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.160
stealthchop_threshold: 999999

#[filament_switch_sensor filament_status]
#pause_on_runout: False
#switch_pin: ^!PC15
#runout_gcode: PAUSE
#insert_gcode: RESUME
#event_delay: 3.0       ; Optional: Delay in seconds before triggering after switch state changes
# pause_delay: 0.5     ; Optional: Delay in seconds after pausing

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC3
# PID CONTROL
#control: pid
#pid_kp: 74.687
#pid_ki: 0.778
#pid_kd: 1792.478
# WATERMARK CONTROL
control: watermark
max_delta: 0.01
#
min_temp: 0
max_temp: 100

[verify_heater heater_bed] 
max_error: 120
check_gain_time: 80
hysteresis: 5
heating_gain: 2

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_accel: 100
max_z_velocity: 10

[delayed_gcode bed_mesh_init]
initial_duration: .01
gcode:
  BED_MESH_PROFILE LOAD=default

[delayed_gcode restart_chromascreen]
initial_duration: .01
gcode:
  RESTART_CHROMASCREEN

[idle_timeout]
gcode:
  {% if printer.pause_resume.is_paused %}
    {action_respond_info("Print is paused - Idle timeout disabled")}    
  {% else %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      {action_respond_info("Idle timeout reached, turning off stepper motors")}
      M84
    {% endif %}
  {% endif %}
timeout: 300

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

#[output_pin beeper]
#pin: EXP1_1

[neopixel neopixel_strip]
pin: PA8
chain_count: 46
color_order: GRB
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 62.0
y_offset: 3.0
#z_offset: 0
probe_with_touch_mode: true
stow_on_each_sample: false
pin_move_time: 0.5
pin_up_touch_mode_reports_triggered: false
speed: 5
lift_speed: 5
samples: 3
sample_retract_dist: 2
samples_tolerance: 0.001
samples_tolerance_retries: 99
samples_result: average

# The following section should be disabled when printer is properly configured.
